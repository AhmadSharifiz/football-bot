# Daily project-management / construction-management digest for @sharifizcom.
# "topic: pm" or "topic: cm" balances the digest (about half each).
# Tested 2026-11-11, not usable: Procore Jobsite (empty), BuiltWorlds (undated old posts), On-Site Magazine,
# Oracle blog (403), Wrike (times out), Atlassian (empty), Autodesk Construction Cloud (403), Fieldwire, BIMplus,
# Lean Construction Blog, Ron Winter (no feed), Construction Executive, Herding Cats, Digital Project Manager (403),
# People and Projects podcast (drops connection), PM World Library (empty), Teamwork (no feed).
# Sources with "focused: true" are about PM/CM already; others must match a keyword in the headline.

keywords: [project, projects, "project management", "project manager", schedule, scheduling, schedules,
           construction, contractor, contractors, contract, contracts, cost, costs, budget, estimating,
           estimate, risk, planning, planner, BIM, Primavera, P6, "critical path", CPM, agile, scrum,
           PMP, stakeholder, stakeholders, delay, delays, claims, infrastructure, megaproject,
           "earned value", procurement, "lean construction", builder, builders, jobsite, site, owner]


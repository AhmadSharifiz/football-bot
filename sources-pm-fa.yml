# Daily Persian-language project-management / construction-management digest for @sharifizcom.
# Persian sources only. "focused: true" sources are about PM/CM already; others must match a keyword in the headline.
# Tested 2026-11-11, not usable: Civil808 (empty), Civilica (no feed).
# Iranian sites are often unreachable from GitHub; run "Test project management digest" to see which work.

keywords: [مدیریت پروژه, کنترل پروژه, مدیر پروژه, برنامه ریزی پروژه, زمان بندی, پریماورا, primavera, MSP,
           PMP, PMBOK, پروژه عمرانی, پروژه های عمرانی, پروژه ساختمانی, عمرانی, پیمانکار, پیمانکاران, پیمانکاری,
           قرارداد, قراردادهای, ساخت و ساز, صنعت ساختمان, ساختمان سازی, انبوه سازان, مسکن ملی, نهضت ملی مسکن,
           زیرساخت, BIM, اسکرام, چابک, ریسک پروژه, ارزش کسب شده, مهندسی ارزش, تاخیرات, ادعا, کلیم, EPC]

# dropped if title or summary mentions any of these (job ads, games, entertainment)
exclude: [استخدام, آگهی, بازی, بازی های, گیم, GTA, فوتبال, فیلم, سریال, موبایل, گوشی, قرعه کشی, خودرو]

